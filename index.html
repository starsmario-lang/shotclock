
<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Training Shot Clock</title>

<link rel="manifest" href="manifest.json">

<style>

html, body{
    margin:0;
    padding:0;
    height:100%;
    background:#111;
    font-family:Arial,sans-serif;
    color:white;
}

body{
    display:flex;
    flex-direction:column;
}

.row{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:2px solid #333;
}

#timerRow{
    cursor:pointer;
    transition:0.2s;
}

.running{
    background:#0a8f3d;
}

.paused{
    background:#b00020;
}

.bigButton{
    font-size:48px;
    font-weight:bold;
    cursor:pointer;
    user-select:none;
}

.timeValue{
    font-size:64px;
    font-weight:bold;
    min-width:120px;
    text-align:center;
}

.smallBtn{
    width:120px;
    height:120px;
    font-size:60px;
    cursor:pointer;
}

.presetValue{
    font-size:72px;
    font-weight:bold;
    min-width:180px;
    text-align:center;
    cursor:pointer;
    user-select:none;
}

</style>
</head>

<body>

<!-- RED 1 -->

<div id="timerRow" class="row paused">

    <button class="smallBtn" onclick="event.stopPropagation();adjustMain(-1)">-</button>

    <div id="timeDisplay" class="timeValue">0</div>

    <button class="smallBtn" onclick="event.stopPropagation();adjustMain(1)">+</button>

</div>

<!-- RED 2 -->

<div class="row">

    <button class="smallBtn" onclick="adjustPreset(0,-1)">-</button>

    <div id="preset0" class="presetValue" onclick="startPreset(0)">16</div>

    <button class="smallBtn" onclick="adjustPreset(0,1)">+</button>

</div>

<!-- RED 3 -->

<div class="row">

    <button class="smallBtn" onclick="adjustPreset(1,-1)">-</button>

    <div id="preset1" class="presetValue" onclick="startPreset(1)">8</div>

    <button class="smallBtn" onclick="adjustPreset(1,1)">+</button>

</div>

<script>

let presets=[16,8];

let currentTime=0;

let running=false;

let timer=null;



function updateDisplay(){

    document.getElementById("timeDisplay").innerText=currentTime;

    const row=document.getElementById("timerRow");

    row.classList.remove("running","paused");

    row.classList.add(running ? "running" : "paused");
}



function speakGerman(text){

    speechSynthesis.cancel();

    const utter=new SpeechSynthesisUtterance(text);

    utter.lang="de-DE";

    speechSynthesis.speak(utter);
}



function numberToGerman(n){

    const map={
        1:"eins",
        2:"zwei",
        3:"drei",
        4:"vier",
        5:"fünf",
        8:"acht",
        16:"sechzehn"
    };

    return map[n] || String(n);
}



function playWhistle(){

    const ctx=new(window.AudioContext||window.webkitAudioContext)();

    const osc=ctx.createOscillator();

    const gain=ctx.createGain();

    osc.frequency.value=1200;

    gain.gain.value=1;

    osc.connect(gain);

    gain.connect(ctx.destination);

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime+2.5
    );

    osc.stop(ctx.currentTime+2.5);
}



function stopEverything(){

    clearInterval(timer);

    speechSynthesis.cancel();
}



function startPreset(index){

    stopEverything();

    currentTime=presets[index];

    running=true;

    updateDisplay();

    speakGerman(numberToGerman(currentTime));

    timer=setInterval(tick,1000);
}



function tick(){

    if(!running) return;

    currentTime--;

    if(currentTime<0){
        currentTime=0;
    }

    updateDisplay();

    if(currentTime>=1 && currentTime<=5){

        speakGerman(numberToGerman(currentTime));

    }

    if(currentTime===0){

        running=false;

        updateDisplay();

        stopEverything();

        playWhistle();
    }
}



function adjustMain(delta){

    currentTime=Math.max(0,currentTime+delta);

    updateDisplay();
}



function adjustPreset(index,delta){

    presets[index]=Math.max(1,presets[index]+delta);

    document.getElementById(
        index===0 ? "preset0":"preset1"
    ).innerText=presets[index];
}



document.getElementById("timerRow")
.addEventListener("click",()=>{

    if(currentTime===0){
        return;
    }

    running=!running;

    updateDisplay();

});



updateDisplay();



if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js");
}

</script>

</body>
</html>
