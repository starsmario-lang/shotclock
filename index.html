<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Training Shot Clock</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid #333;
  }

  /* RED 1 */
  #top {
    flex: 0.33;
    font-size: 48px;
    font-weight: bold;
    cursor: pointer;
    gap: 20px;
  }

  #top button {
    font-size: 20px;
    padding: 5px 10px;
  }

  #timeDisplay {
    flex: 1;
    text-align: center;
  }

  /* RED 2 & 3 */
  .preset {
    flex: 0.33;
    flex-direction: column;
  }

  .presetRow {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    font-size: 32px;
  }

  .btn {
    font-size: 24px;
    padding: 10px 15px;
    cursor: pointer;
  }

  /* colors */
  .running {
    background: #0a5;
  }

  .paused {
    background: #a00;
  }

</style>
</head>

<body>

<!-- RED 1 -->
<div id="top" class="row paused">
  <button onclick="adjustMain(-1)">-</button>
  <div id="timeDisplay">0</div>
  <button onclick="adjustMain(1)">+</button>
</div>

<!-- RED 2 -->
<div class="row preset">
  <div class="presetRow">
    <button onclick="adjustPreset(0,-1)">-</button>
    <div onclick="startPreset(0)" id="p0">16</div>
    <button onclick="adjustPreset(0,1)">+</button>
  </div>
</div>

<!-- RED 3 -->
<div class="row preset">
  <div class="presetRow">
    <button onclick="adjustPreset(1,-1)">-</button>
    <div onclick="startPreset(1)" id="p1">8</div>
    <button onclick="adjustPreset(1,1)">+</button>
  </div>
</div>

<script>
let mainTime = 0;
let running = false;
let interval;

let presets = [16, 8];

const top = document.getElementById("top");
const display = document.getElementById("timeDisplay");

function updateDisplay() {
  display.innerText = mainTime;
  top.className = "row " + (running ? "running" : "paused");
}

function speak(text) {
  speechSynthesis.cancel();
  let u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE";
  speechSynthesis.speak(u);
}

function startTimer(duration) {
  clearInterval(interval);
  speechSynthesis.cancel();

  mainTime = duration;
  running = true;
  updateDisplay();

  speak(duration === 16 ? "sechzehn" : duration === 8 ? "acht" : duration.toString());

  interval = setInterval(() => {
    if (!running) return;

    mainTime--;
    updateDisplay();

    if (mainTime <= 5 && mainTime > 0) {
      speak(mainTime === 5 ? "fünf"
        : mainTime === 4 ? "vier"
        : mainTime === 3 ? "drei"
        : mainTime === 2 ? "zwei"
        : mainTime === 1 ? "eins"
        : "");
    }

    if (mainTime <= 0) {
      clearInterval(interval);
      running = false;
      updateDisplay();
      playWhistle();
    }
  }, 1000);
}

function playWhistle() {
  let ctx = new (window.AudioContext || window.webkitAudioContext)();
  let osc = ctx.createOscillator();
  let gain = ctx.createGain();

  osc.type = "sine";
  osc.frequency.value = 900;

  gain.gain.setValueAtTime(0.3, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start();
  osc.stop(ctx.currentTime + 1.5);
}

// RED 1 toggle
top.addEventListener("click", () => {
  running = !running;
  updateDisplay();
});

// main +/- (adjust live)
function adjustMain(v) {
  mainTime = Math.max(0, mainTime + v);
  updateDisplay();
}

// presets
function adjustPreset(i, v) {
  presets[i] = Math.max(1, presets[i] + v);
  document.getElementById("p" + i).innerText = presets[i];
}

function startPreset(i) {
  startTimer(presets[i]);
}

updateDisplay();
</script>

</body>
  </html>
