<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Training Shot Clock</title>

<link rel="manifest" href="manifest.json">

<style>

html, body{
    margin:0;
    padding:0;
    height:100%;
    background:#111;
    font-family:Arial,sans-serif;
    color:white;
}

body{
    display:flex;
    flex-direction:column;
}

.row{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:2px solid #333;
}

#timerRow{
    cursor:pointer;
    transition:0.2s;
}

.running{
    background:#0a8f3d;
}

.paused{
    background:#b00020;
}

.timeValue{
    font-size:64px;
    font-weight:bold;
    min-width:120px;
    text-align:center;
}

.smallBtn{
    width:120px;
    height:120px;
    font-size:60px;
    cursor:pointer;
}

.presetValue{
    font-size:72px;
    font-weight:bold;
    min-width:180px;
    text-align:center;
    user-select:none;
}

</style>
</head>

<body>

<!-- RED 1 -->

<div id="timerRow" class="row paused">

    <button class="smallBtn"
        onclick="event.stopPropagation();adjustMain(-1)">
        -
    </button>

    <div id="timeDisplay" class="timeValue">0</div>

    <button class="smallBtn"
        onclick="event.stopPropagation();adjustMain(1)">
        +
    </button>

</div>

<!-- RED 2 -->

<div class="row"
     onclick="startPreset(0)">

    <button class="smallBtn"
        onclick="event.stopPropagation();adjustPreset(0,-1)">
        -
    </button>

    <div id="preset0" class="presetValue">16</div>

    <button class="smallBtn"
        onclick="event.stopPropagation();adjustPreset(0,1)">
        +
    </button>

</div>

<!-- RED 3 -->

<div class="row"
     onclick="startPreset(1)">

    <button class="smallBtn"
        onclick="event.stopPropagation();adjustPreset(1,-1)">
        -
    </button>

    <div id="preset1" class="presetValue">8</div>

    <button class="smallBtn"
        onclick="event.stopPropagation();adjustPreset(1,1)">
        +
    </button>

</div>

<script>

let presets=[16,8];

let currentTime=0;
let running=false;
let timer=null;

let sirenContext=null;
let sirenOscillators=[];

function updateDisplay(){

    document.getElementById("timeDisplay").innerText=currentTime;

    const row=document.getElementById("timerRow");

    row.classList.remove("running","paused");

    row.classList.add(
        running ? "running" : "paused"
    );
}

function stopSiren(){

    try{

        sirenOscillators.forEach(o=>{

            try{
                o.stop();
            }catch(e){}
        });

    }catch(e){}

    sirenOscillators=[];

    if(sirenContext){

        try{
            sirenContext.close();
        }catch(e){}

        sirenContext=null;
    }
}

function speakGerman(text){

    speechSynthesis.cancel();

    const utter=
        new SpeechSynthesisUtterance(text);

    utter.lang="de-DE";

    speechSynthesis.speak(utter);
}

function playWhistle(){

    stopSiren();

    sirenContext=
        new(window.AudioContext||
            window.webkitAudioContext)();

    const frequencies=[
        1200,
        1600,
        2000
    ];

    frequencies.forEach(freq=>{

        const osc=
            sirenContext.createOscillator();

        const gain=
            sirenContext.createGain();

        osc.type="square";

        osc.frequency.value=freq;

        gain.gain.value=0.35;

        osc.connect(gain);
        gain.connect(
            sirenContext.destination
        );

        osc.start();

        gain.gain.setValueAtTime(
            0.35,
            sirenContext.currentTime
        );

        gain.gain.linearRampToValueAtTime(
            0.55,
            sirenContext.currentTime+0.15
        );

        gain.gain.linearRampToValueAtTime(
            0.25,
            sirenContext.currentTime+0.30
        );

        gain.gain.linearRampToValueAtTime(
            0.55,
            sirenContext.currentTime+0.45
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            sirenContext.currentTime+2.5
        );

        osc.stop(
            sirenContext.currentTime+2.5
        );

        sirenOscillators.push(osc);

    });
}

function stopEverything(){

    clearInterval(timer);

    speechSynthesis.cancel();

    stopSiren();
}

function shouldSpeakNumber(n,startValue){

    if(n<=0) return false;

    if(n<=5) return true;

    if(n===8 && startValue>8)
        return true;

    if(n===12 && startValue>12)
        return true;

    return false;
}

function startPreset(index){

    stopEverything();

    currentTime=presets[index];

    running=true;

    updateDisplay();

    speakGerman(String(currentTime));

    timer=setInterval(tick,1000);
}

function tick(){

    if(!running) return;

    const startValue=currentTime;

    currentTime--;

    if(currentTime<0){
        currentTime=0;
    }

    updateDisplay();

    if(
        shouldSpeakNumber(
            currentTime,
            presets[0]===startValue ||
            presets[1]===startValue
                ? startValue
                : 999
        )
    ){
        speakGerman(
            String(currentTime)
        );
    }

    if(currentTime===0){

        running=false;

        updateDisplay();

        clearInterval(timer);

        speechSynthesis.cancel();

        playWhistle();
    }
}

function adjustMain(delta){

    currentTime=
        Math.max(
            0,
            currentTime+delta
        );

    updateDisplay();
}

function adjustPreset(index,delta){

    presets[index]=
        Math.max(
            1,
            presets[index]+delta
        );

    document.getElementById(
        index===0
        ? "preset0"
        : "preset1"
    ).innerText=
        presets[index];
}

document
.getElementById("timerRow")
.addEventListener("click",()=>{

    if(currentTime===0){
        return;
    }

    running=!running;

    updateDisplay();

});

updateDisplay();

if("serviceWorker" in navigator){

    navigator.serviceWorker
    .register("sw.js");
}

</script>

</body>
    </html>
